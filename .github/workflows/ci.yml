name: CI

# Проверки перед деплоем: линтеры, тесты бэкенда, сборка и e2e в браузере.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_USER: ozen_user
  PG_PASSWORD: dev_pass_123

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ozen_user
          POSTGRES_PASSWORD: dev_pass_123
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ozen_user" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_HOST: localhost
      TEST_DB_USER: ozen_user
      TEST_DB_PASSWORD: dev_pass_123
      STORAGE_LOCAL_PATH: /tmp/ozen-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend — eslint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ozen_user
          POSTGRES_PASSWORD: dev_pass_123
          POSTGRES_DB: ozen_lms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ozen_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ozen_user:dev_pass_123@localhost:5432/ozen_lms
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-123456
      STORAGE_LOCAL_PATH: /tmp/ozen-storage
      DEBUG: 'false'
      # Playwright перед прогоном пересоздаёт тестовые данные этой командой (из корня репо).
      E2E_SEED_CMD: cd backend && python -m scripts.seed_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend — зависимости, миграции, запуск
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done

      - name: Frontend — зависимости и браузер
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Лог бэкенда
        if: failure()
        run: tail -n 200 /tmp/backend.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
