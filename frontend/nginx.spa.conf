server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Add .mjs MIME type (not in default nginx mime.types)
    types {
        application/javascript  js mjs;
        text/css                css;
        text/html               html htm;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/gif               gif;
        image/svg+xml           svg;
        image/x-icon            ico;
        font/woff               woff;
        font/woff2              woff2;
        font/ttf                ttf;
        font/eot                eot;
        application/json        json;
        application/octet-stream  bin;
    }

    # index.html никогда не кешировать — браузер всегда берёт свежий
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
