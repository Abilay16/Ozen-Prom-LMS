events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               text/xml application/xml image/svg+xml application/manifest+json;

    # Защитные заголовки. `always` — и на ответах с ошибками. Важно: если в
    # location есть свой add_header, эти НЕ наследуются — там их повторяем.

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name ozenlms.kz www.ozenlms.kz;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;  # параллельная загрузка файлов в одном соединении
        server_name ozenlms.kz www.ozenlms.kz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;  # повторный заход с телефона без полного TLS-рукопожатия

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Docker internal DNS — re-resolve backend IP on every deploy
        resolver 127.0.0.11 valid=30s ipv6=off;

        # API
        location /api/ {
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
        }

        # Internal: nginx serves media files directly (X-Accel-Redirect)
        location /internal/storage/ {
            internal;
            alias /storage/;
        }

        # Public static files (docs, instructions)
        location /public/ {
            alias /storage/public/;
            add_header Content-Disposition "inline";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
